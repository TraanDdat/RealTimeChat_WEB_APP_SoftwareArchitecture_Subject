[project]
name = "realtime-chat-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cloudinary>=1.40,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "limits>=3.13,<6",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.7,<3",
    "pymongo>=4.10,<5",
    "python-socketio>=5.11,<6",
    "SQLAlchemy>=1.4,<2.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mongomock>=4.3,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]