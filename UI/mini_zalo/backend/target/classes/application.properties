spring.datasource.url=jdbc:h2:file:./data/mini-zalo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
app.chat.user-a-password=${USER_A_PASSWORD:UserA123!}
app.chat.user-b-password=${USER_B_PASSWORD:UserB123!}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
